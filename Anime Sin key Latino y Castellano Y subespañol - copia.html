        * {

            padding: 0;
            box-sizing: border-box;
        }

            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);

            padding: 20px;
            color: white;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
        }

        .premium-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            border: none;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none; /* Ocultar inicialmente */
        }

        .premium-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin: 20px auto;
            max-width: 800px;
            padding: 0 20px;
        }

        #search-input {
            flex-grow: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
        }

        #sort-select {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        #results {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(5, 1fr);
            padding: 20px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .anime-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            z-index: 1;
        }

        .anime-card.premium {
            position: relative;
            overflow: hidden;
        }

        .anime-card.premium::before {
            content: '🔒 Premium';
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 15px;
            color: gold;
            font-size: 0.8rem;
            z-index: 1;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .anime-image-container {
            width: 100%;
            padding-top: 150%; /* 2:3 aspect ratio */
            position: relative;
            overflow: hidden;
        }

        .anime-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .anime-title {
            font-size: 1rem;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .anime-description {
            color: #666;
            font-size: 0.8rem;
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .watch-button {
            display: block;
            width: 100%;
            padding: 8px;
            background: #4a90e2;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
            margin-top: auto;
            font-size: 0.9rem;
        }

        .watch-button:hover {
            background: #357abd;
        }

        .premium-locked .watch-button {
            background: #888;
            cursor: not-allowed;
        }

        mark {
            background-color: #ffd700;
            padding: 0 2px;
            border-radius: 3px;
        }

        @media (max-width: 1200px) {
            #results {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 992px) {
            #results {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            #results {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-bar {
                flex-direction: column;
            }

            #search-input, #sort-select {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            #results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function normalizeString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function highlightMatch(text, searchTerm) {
            if (!searchTerm) return text;
            const regex = new RegExp(`(${searchTerm})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function checkPremiumAccess(searchTerm) {
            if (normalizeString(searchTerm) === normalizeString(PREMIUM_KEY)) {
                premiumUnlocked = true;
                premiumButton.style.display = 'block';
                searchInput.value = '';
                alert('¡Contenido premium desbloqueado!');
                updateResults();
                return true;
            }
            return false;
        }

        function togglePremiumContent() {
            showingPremiumOnly = !showingPremiumOnly;
            premiumButton.style.background = showingPremiumOnly
                ? 'linear-gradient(45deg, #FFA500, #FFD700)'
                : 'linear-gradient(45deg, #FFD700, #FFA500)';
            updateResults();
        }

        function updateResults() {
            const searchTerm = normalizeString(searchInput.value);
            const sortOrder = sortSelect.value;

            if (checkPremiumAccess(searchTerm)) return;

            const filteredAndSortedAnime = animeList
                .filter(anime => {
                    const isPremiumMatch = (!anime[4] || premiumUnlocked);
                    const isPremiumFilter = !showingPremiumOnly || (showingPremiumOnly && anime[4]);
                    const isSearchMatch = (normalizeString(anime[0]).includes(searchTerm) ||
                                        normalizeString(anime[1]).includes(searchTerm));
                    return isPremiumMatch && isPremiumFilter && isSearchMatch;
                })
                .sort((a, b) => {
                    const comparison = a[0].localeCompare(b[0]);
                    return sortOrder === 'asc' ? comparison : -comparison;
                });

            resultsContainer.innerHTML = filteredAndSortedAnime.map((anime, index) => `
                <div class="anime-card ${anime[4] ? 'premium' : ''} ${!premiumUnlocked && anime[4] ? 'premium-locked' : ''}" role="listitem">
                    <div class="anime-number">#${index + 1}</div>
                    <div class="anime-image-container">
                        <img class="anime-image" src="${anime[2]}" alt="${anime[0]}" onerror="this.src='https://via.placeholder.com/300x450?text=Anime'">
                    </div>
                    <div class="anime-info">
                        <div class="anime-title">${highlightMatch(anime[0], searchInput.value)}</div>
                        <div class="anime-description">${highlightMatch(anime[1], searchInput.value)}</div>
                        <a href="${!premiumUnlocked && anime[4] ? '#' : anime[3]}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="watch-button"
                           ${!premiumUnlocked && anime[4] ? 'onclick="return false;"' : ''}>
                            ${!premiumUnlocked && anime[4] ? '🔒 Contenido Premium' : 'Ver Anime'}
                        </a>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', updateResults);
        sortSelect.addEventListener('change', updateResults);
        premiumButton.addEventListener('click', togglePremiumContent);

        document.addEventListener('keydown', function(event) {
            if (event.key.toLowerCase() === 'x') {
                xKeyPressCount++;
                if (xKeyPressCount === requiredPresses) {
                    premiumUnlocked = true;
                    premiumButton.style.display = 'block';
                    alert('¡Contenido premium desbloqueado!');
                    updateResults();
                    xKeyPressCount = 0;
                }
            } else {
                xKeyPressCount = 0;
            }
        });

        updateResults();
    </script>
